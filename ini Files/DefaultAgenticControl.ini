+Hints=(Category="Server Readiness",Text="The server is ready when matchPhase.phase != \"None\" on the server target (MMS assigned a match), OR waitForLog matches \"state changed.*to: Registered\" in category LogOnlineGame. The server WebSocket may drop and reconnect during init while the game thread blocks on state-graph processing — that is normal; poll until reconnected and one condition holds.")
+Hints=(Category="Client Readiness",Text="The client frontend is loaded when frontend.currentScreen == \"Home\". After this is true the UI may still be settling and one-time onboarding modals may be up (see Onboarding Modals) - dismiss them, then verify a known play-card element is present before matchmaking. currentScreen stays \"Home\" while onboarding modals are displayed.")
+Hints=(Category="Login and EULA",Text="The client auto-logs-in from -AUTH_LOGIN/-AUTH_PASSWORD/-AUTH_TYPE launch args. On first login for an account the Epic Games Terms of Service (EULA) appears: optionally scroll the text, then click ACCEPT (a CommonUI button; the plugin's hover handling makes the click actuate). The log line 'Widget_OldEula ... isn't focusable - focusing the game viewport' is benign - the mouse click still accepts.")
+Hints=(Category="Onboarding Modals",Text="After login (fresh account state) one-time notices appear over the lobby while currentScreen is still \"Home\", in sequence: 'ABOUT VOICE REPORTING' (buttons KEEP VOICE CHAT ON / TURN OFF VOICE CHAT / LEARN MORE - click KEEP VOICE CHAT ON), then 'TEXT REPORTING UPDATE' (OKAY), then possibly 'New accessibility features'. Click each affirmative button to dismiss and reach the clean play card.")
+Hints=(Category="Frontend Navigation",Text="The lobby (currentScreen \"Home\") shows the character, a row of discovery tiles along the BOTTOM, and the Battle Royale play card on the LEFT. The play card stacks top-to-bottom: \"BATTLE ROYALE++\" (mode title), a 'Build, Duo' match-options button, 'Equip a sprite', then the yellow PLAY button. No scroll is needed; the play card is visible at load. WARNING: the bottom discovery tiles are featured-island links - clicking one navigates AWAY from Battle Royale (the 'left the BR tile' trap). Avoid the bottom tiles when entering a BR match.")
+Hints=(Category="Clicking the Play Button",Text="To start a BR match, click the PLAY button in the LEFT play card (the button below 'Equip a sprite'). Do NOT rely on findAndClick text \"Play\": it matches a discovery tile (ActivityBrowserTile) or a non-interactable \"Play\" label, NOT the matchmaking button. Reliable approach: getWidgetTree (maxDepth 60+, now uncapped to 100) to locate the SimpleCommonButton inside WBP_UI_Lobby_Matchmaking_C and click its geometry centre. A correct click logs 'LogMatchmakingServiceClient: StartMatchmaking' and the button changes to CANCEL. A 'Start Match' dev button (when present, above CANCEL) drops straight into the LOCAL server, bypassing the MMS queue.")
+Hints=(Category="Button Actuation",Text="CommonUI buttons (SCommonButton/SButton) only fire their click for a MOUSE event when the widget IsHovered(). The plugin establishes hover automatically (an explicit ProcessMouseMoveEvent at the target before the press), so a mouseClick/findAndClick that lands on a CommonButton actuates it even when the game window is backgrounded. If a click reports clicked:true but nothing changes, it landed on the WRONG widget - use getWidgetTree to confirm the leaf under the cursor and re-aim. It is not a hover problem.")
+Hints=(Category="Popups and Dialogs",Text="Safe affirmative dismissals: \"Got It\", \"GOT IT\", \"OK\", \"Okay\", \"Continue\". During matchmaking do NOT click \"CANCEL\" (cancels the queue) or \"Close\". After clicking PLAY an 'Accessibility Features' notice may appear; dismiss it before re-interacting with the play card.")
+Hints=(Category="State Sources",Text="Always call meta.describe first; do not assume sources exist. Fortnite registers: loadingScreen (isActive bool; client only), frontend (currentScreen string, isDiscoveryReady bool; client only), matchPhase (phase string, timeRemaining float, safeZonePhase int; client + server), world (mapName string, netMode string, worldType string; client + server). The current level is world.mapName (works any time, not just during loading).")
+Hints=(Category="BR Match Lifecycle",Text="Phase progression: None -> Setup -> Warmup -> Aircraft -> SafeZones -> EndGame. None=on frontend; Setup=connecting/warmup island; Aircraft=battle bus; SafeZones=main gameplay, storm closing; EndGame=results. Use waitForState matchPhase.phase != \"None\" to detect match entry, and matchPhase.phase == \"EndGame\" to detect completion.")
+Hints=(Category="Common Failure Modes",Text="PLAY navigates to a mode/discovery experience instead of queueing -> you clicked a bottom discovery tile (not the left play-card button); re-observe and click the LEFT play card. Matchmaking reaches QueueFull -> the bucket has no available server (the local server dropped its MMS registration after idling, or registered a different playlist); use 'Start Match' for the local server, or restart the server. matchPhase stays None after queueing -> MMS did not assign; wait longer or restart the server. WebSocket drops during server init -> game thread blocked; normal, poll until reconnected. Clicks land but nothing happens -> WRONG widget under the cursor (not a focus or hover problem); confirm the leaf with getWidgetTree (now reaches deep CommonUI, maxDepth up to 100) and re-aim. NOTE: the normal PLAY/queue routes to a backend dev server (e.g. 10.x.x.x), NOT the local server; use 'Start Match' to enter the local server.")

+Hints=(Category="Sidebar and Social Panel",Text="At the lobby (frontend.currentScreen=Home) press Escape (console: the Start/menu button) to open the right-side Social/system sidebar: a top icon row (Social, Party, Settings gear, Exit) above the friends list and Party/Game chat tabs. Escape from a sub-screen (e.g. the Discover/browse grid behind the PLAY tab) first goes BACK to the lobby - press Escape AGAIN from the lobby to open the sidebar. Synthetic Escape only routes once the game window has focus; do a mouseMove first (it brings the window to front) then keyPress Escape.")
+Hints=(Category="Social Panel Interaction",Text="Friend names and CommonUI rich-text labels in the Social panel ARE readable and clickable by text (findAndClick / findElement with locator=text); the serializer extracts SRichTextBlock, not just STextBlock. Verified flow to party up with a friend: open the Social sidebar (Escape from Home), findAndClick the friend's display name (e.g. \"matchison5\") to open their profile panel, then findAndClick a text action button: \"Invite to Epic Party\", \"Join Epic Party\", or \"Accept Epic Party Invite\" (the last appears on the inviter's panel when they have invited you). CAVEAT: the small inline accept/decline ICONS on an invite row are icon-only buttons with NO text - do not target them by text; open the inviter's profile panel and click \"Accept Epic Party Invite\" instead.")
+Hints=(Category="UI Navigation Strategy",Text="General approach for ANY lobby menu/screen: most tabs, list entries, labels, and buttons are CommonUI text and are reachable by findAndClick locator=text (the serializer reads STextBlock AND SRichTextBlock). When a screen's exact labels are unknown, call getWidgetTree (maxDepth 60+) and read the interactable nodes' text, then findAndClick the one you want; confirm the result with a follow-up capture or getWidgetTree. The frontend tree is DEEP (interactable labels often sit ~40+ levels down): if a getWidgetTree response has truncatedByDepth:true it was cut off before reaching them - retry with a higher maxDepth. Only a few controls are ICON-ONLY with no text and need a position/visual click (mouseClick with viewport coords): the sidebar gear (Settings) and '...' (overflow Menu), the lobby account avatar, and the party-invite accept/decline icons. Default to text locators; fall back to getWidgetTree + position only for those icon-only controls.")
+Hints=(Category="Frontend Top Navigation",Text="The lobby top bar is a row of text tabs, each reachable by findAndClick locator=text: \"PLAY\", \"Sprites\", \"SHOP\", \"Locker\", \"Passes\" (the Battle Pass / passes screen; the tab text is \"Passes\", not \"Battle Pass\"), \"Quests\", \"COMPETE\", \"CAREER\", \"V-BUCKS\". Clicking a tab switches the main panel to that area - use these for non-match workflows (open the Locker, Item Shop, Quests, etc.). IMPORTANT: frontend.currentScreen stays \"Home\" for ALL of these top-nav sub-tabs (it tracks the lobby hub, not the active tab) - do NOT use currentScreen to confirm you reached a sub-tab; verify with a capture or getWidgetTree instead. The account avatar is the icon-only button at the far top-right.")
+Hints=(Category="Settings Menu",Text="Open Settings: from the lobby (currentScreen=Home) press Escape to open the sidebar, then click the GEAR/cog icon in the sidebar's top icon row. That gear is icon-only (no text label) - it is the one step that needs a position/visual click, not a text locator (the adjacent '...' icon opens the overflow Menu instead; a correct click lands on the full-screen Settings, which has a row of category tabs). Once open, Settings is fully text-navigable. Category tabs render as icons but expose text labels - findAndClick locator=text any of: \"Video\", \"Audio\", \"Communication\", \"Game\", \"Game UI\", \"Touch and Motion\", \"Mouse and Keyboard\", \"Keyboard Controls\", \"Controller\", \"Controller Mapping\", \"Account and Privacy\". Each category has a left-hand text sub-nav (e.g. Video: \"Display\"/\"Graphics\"/\"Graphics Quality\"/\"Advanced Graphics\"; Audio: \"Volume\"/\"Sound\"/\"Creator Options\"/\"Jam Tracks\"). To CHANGE a discrete setting: findAndClick the setting's current-VALUE button (the value text, e.g. \"Off\", \"120 FPS\", \"Windowed\", \"DIRECTX 12\") - a detail panel opens on the right with the description and the options as text buttons (e.g. \"OFF\"/\"ON\") - findAndClick the desired option; it applies immediately (there is NO global Apply button). Continuous settings (volume bars, \"Brightness\", \"User Interface Contrast\") are drag sliders, not text-selectable - set them with a mouse drag. Exit with \"Back\"; \"Restore to default\" resets the current page.")
+Hints=(Category="System Overflow Menu",Text="The Escape-sidebar top icon row also has an '...' overflow Menu icon (icon-only, near the gear). Clicking it opens a text menu (items via findAndClick locator=text): \"Parental controls\", \"Manage unlocked content\", \"Support and refunds\", \"Report\", \"Legal\", and in developer builds \"Cheats (developer)\" and \"Locker (developer)\", plus a console-command entry field at the bottom. For console commands prefer the bridge consoleCommand route over typing into that field.")

+ConfigRequirements=(Key="login",Description="Account login. The client auto-logs-in from -AUTH_LOGIN / -AUTH_PASSWORD / -AUTH_TYPE launch args when a credential is supplied; omit it to run the signed-out / no-login path. Optional — never required.",bOptional=True,CredentialType="epic",Fields=("login","password"))

