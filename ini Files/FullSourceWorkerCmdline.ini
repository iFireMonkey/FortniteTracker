
[Server]
!Args=ClearArray
+Args=-DisablePreload
+Args=-AssetGatherSync=False
+Args=-VKEditServer
+Args=-LocalE2E
+Args=-SkipHotfixCheck
+Args=-SkipDADCheck
+Args=-ServesPlaylists=Playlist_VK_Edit
+Args=-ValkyrieSource
+Args=-EnablePlugins=ValkyrieFortnite,VKEdit
+Args=-rpcconfig=SEWRpc
+Args=-TargetFortReleaseVersion=Future
+Args=-saveddirsuffix=Uncooked
+Args=-DisablePython
+Args=-UseLocalIPs
+Args=-NoFakeForking
+Args=-UsePerfThreads
+Args=-Fort.EnableMinimalLobbyInitialState
+Args=-Auth_Type=epic
+Args=-enablemms
+Args=-noepicportal
+Args=-nobe
+Args=-noeac
+Args=-skippatchcheck
+Args=-NoAntiCheatBans
+Args=-NoTimeouts
+Args=-EditorPermission=VKCreateUGCEpicDeveloper
+Args=-ini:Engine:[SystemSettings]:Preload.Playlist=Playlist_VK_Edit
+Args=-ini:EditorPerProjectUserSettings:[/Script/FortniteGame.FortDeveloperSettings]:bEnableGameFeaturePluginProfiles=false
+Args=-ini:EditorPerProjectUserSettings:[/Script/ValkyrieEditor.ValkyrieEditorConfig]:UserPreferencePermissions=VKCreateUGCEpicDeveloper
+Args=-ini:EditorPerProjectUserSettings:[/Script/ValkyrieEditor.ValkyrieEditorConfig]:bValkyrieMode=true
+Args=-ini:EditorPerProjectUserSettings:[/Script/ValkyrieEditor.ValkyrieEditorConfig]:bOverrideValidationWithLocalFiles=true
+Args=-ini:EditorPerProjectUserSettings:[/Script/ValkyrieEditor.ValkyrieEditorConfig]:bAutomaticallyLaunchClientWhenTesting=false
+Args=-ini:Engine:[ConsoleVariables]:Athena.EnableVKPlayMinimum=false
+Args=-ExecCmds="Valkyrie.AllowOverrideValidationWithLocalFilesInCommandlet 1, Log LogLiveEditObject Verbose, Log LogValkyrieBeacon Verbose, Log LogValkyrieFortniteEditorLiveEdit Verbose"
+Args=-dpcvars=ValkyrieBeaconHost.EnableValkyrieBeaconHostValidation=false,Valkyrie.EnableLocalSentryValidation=0,ValkyrieValidator.SkipVersePrecheck=true

[Client]
!Args=ClearArray
+Args=-VK.JoinEditOnLaunch
+Args=-LocalE2E
+Args=-ValkyrieSource
+Args=-ValkyrieSourceRoots=CoronadoGFS
+Args=-EnablePlugins=ValkyrieFortnite,VKEdit
+Args=-rpcconfig=SEWRpc
+Args=-TargetFortReleaseVersion=Future
+Args=-saveddirsuffix=Uncooked
+Args=-EpicPortal
+Args=-Auth_Type=NoMCP
+Args=-DisablePython
+Args=-NoTimeouts
+Args=-dpcvars=MM.SkipWaitForServer=true,MM.PreloadAthena=false,Fort.Rollback.CleanupOldContentBeacon=1
+Args=-ExecCmds="Log LogLiveEditObject Verbose, Log LogValkyrieBeacon Verbose, Log LogValkyrieFortniteEditorLiveEdit Verbose"
